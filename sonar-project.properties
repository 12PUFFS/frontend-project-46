# SonarQube project configuration
sonar.projectKey=12puffs-1_frontend-project-46
sonar.organization=12puffs-1

# Project metadata
sonar.projectName=frontend-project-46
sonar.projectVersion=1.0.0

# Sources and tests
sonar.sources=src,bin
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.js

# JavaScript configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/__fixtures__/**

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage settings
sonar.coverage.exclusions=**/bin/**,**/__tests__/**,**/__fixtures__/**
